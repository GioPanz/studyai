<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyAI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#0f172a,#1d4ed8,#312e81);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:white;
}
.card{
  width:100%;
  max-width:750px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(16px);
  border-radius:24px;
  padding:30px;
}
h1{font-size:40px;margin-bottom:10px}
p{color:#cbd5e1;margin-bottom:20px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.tag{
  background:rgba(255,255,255,.12);
  padding:8px 14px;
  border-radius:999px;
  font-size:14px;
}
textarea{
  width:100%;
  height:200px;
  border:none;
  border-radius:16px;
  padding:15px;
  font-size:16px;
  resize:none;
}
button{
  width:100%;
  margin-top:15px;
  padding:16px;
  border:none;
  border-radius:16px;
  background:#22c55e;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}
#output{
  margin-top:20px;
  padding:18px;
  background:rgba(255,255,255,.12);
  border-radius:16px;
  min-height:100px;
  white-space:pre-wrap;
}
</style>
</head>
<body>
<div class="card">
  <h1>🧠 StudyAI</h1>
  <p>Riassunti, Quiz e Flashcard con l'Intelligenza Artificiale.</p>

  <div class="tools">
    <div class="tag">📄 Riassunti</div>
    <div class="tag">❓ Quiz</div>
    <div class="tag">🧠 Flashcard</div>
  </div>

  <textarea id="input" placeholder="Incolla qui un testo..."></textarea>

  <button onclick="summarize()">✨ Riassumi con AI</button>

  <div id="output">Il riassunto comparirà qui.</div>
</div>

<script>
async function summarize() {
  const text = document.getElementById("input").value.trim();

  if (!text) {
    document.getElementById("output").innerText = "Incolla un testo prima.";
    return;
  }

  document.getElementById("output").innerText = "⏳ Sto generando il riassunto...";

  try {
    const response = await fetch("/api/summarize", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ text })
    });

    const data = await response.json();

    document.getElementById("output").innerText = data.summary || "Errore nel riassunto.";
  } catch (err) {
    document.getElementById("output").innerText = "Errore di connessione.";
  }
}
</script>
</body>
</html>
