<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyAI</title>
  <style>
    body{
      font-family:Arial,sans-serif;
      background:#0f172a;
      color:white;
      max-width:700px;
      margin:40px auto;
      padding:20px;
    }
    textarea{
      width:100%;
      height:180px;
      padding:10px;
      border-radius:10px;
      font-size:16px;
    }
    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      background:#22c55e;
      color:white;
      font-size:16px;
      cursor:pointer;
    }
    #output{
      margin-top:20px;
      padding:15px;
      background:#1e293b;
      border-radius:10px;
      white-space:pre-wrap;
    }
  </style>
</head>
<body>
  <h1>📚 StudyAI</h1>
  <p>Incolla un testo e ottieni un riassunto.</p>

  <textarea id="input" placeholder="Scrivi qui il testo..."></textarea>
  <button onclick="summarize()">Genera riassunto</button>

  <div id="output">Il riassunto apparirà qui.</div>

  <script>
    function summarize(){
      const text=document.getElementById('input').value.trim();
      if(!text){
        document.getElementById('output').innerText='Inserisci un testo.';
        return;
      }
      const sentences=text.split(/(?<=[.!?])\s+/);
      document.getElementById('output').innerText=sentences.slice(0,3).join(' ');
    }
  </script>
</body>
</html>
